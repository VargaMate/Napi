<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1726">
<title>Napi vs Batatrans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1726;
    --panel: #2a2338;
    --ink: #f4ecdc;
    --muted: #a99fbd;
    --accent: #ff7a2f;
    --frame: #0e0b14;
    --pad: 16px;
    --chrome: 260px;   /* height kept free for the title and hints */
    --side: 0px;       /* width taken by the touch buttons beside the game */
    --max: min(1400px, 90vw);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #2d2442 0%, var(--bg) 60%) var(--bg);
    color: var(--ink);
    font-family: "Tiny5", ui-monospace, Consolas, monospace;
    /* keep clear of notches and rounded corners */
    padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
             max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* as wide as the window allows while the whole game, title and hints still fit on screen */
  main { width: 100%; max-width: max(280px, min(var(--max), calc((100vh - var(--chrome)) * 800 / 260 + var(--side)))); }
  @supports (height: 100dvh) {
    main { max-width: max(280px, min(var(--max), calc((100dvh - var(--chrome)) * 800 / 260 + var(--side)))); }
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; margin-left: auto; }
  h1 {
    margin: 0;
    font-family: "Press Start 2P", ui-monospace, Consolas, monospace;
    font-size: clamp(14px, 2.4vw, 32px);
    font-weight: normal;
    letter-spacing: 2px;
    line-height: 1.4;
    text-shadow: 3px 3px 0 #000;
  }
  h1 span { color: var(--accent); }
  h1 small { font-size: 0.6em; color: var(--muted); }
  button {
    font: inherit;
    font-size: 20px;
    color: var(--ink);
    background: var(--panel);
    border: 0;
    padding: 10px 12px;
    white-space: nowrap;
    flex-shrink: 0;
    cursor: pointer;
    box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.4), 0 0 0 3px var(--frame);
  }
  /* on touch screens :hover sticks after a tap, so only real pointers get it */
  @media (hover: hover) {
    button:hover { background: var(--accent); color: var(--frame); }
  }
  .screen {
    position: relative;
    border: 6px solid var(--frame);
    box-shadow: 0 0 0 3px #4a3f63, 8px 8px 0 3px #000;
  }
  /* CRT scanlines */
  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0 1px, transparent 1px 3px);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 800 / 260;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  /* text layer: drawn at full resolution so Hungarian accents stay sharp */
  #hud {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: auto;
    pointer-events: none;
  }
  .hint { margin-top: 22px; font-size: 20px; color: var(--muted); line-height: 1.9; }
  kbd {
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    padding: 2px 6px;
    box-shadow: 0 0 0 2px var(--frame);
  }
  .rotate, .touch, .pad { display: none; }
  .rotate { color: var(--accent); }
  .stage { display: grid; }

  /* on-screen duck (left) and jump (right) buttons */
  .pad {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0;
    font-size: 14px;
    touch-action: none;
  }
  .pad svg { width: 40px; height: 40px; }
  .pad.on { background: var(--accent); color: var(--frame); }

  /* touch screens: buttons under the game, no keyboard hints; in portrait suggest turning the phone */
  @media (hover: none) and (pointer: coarse) {
    :root { --max: 1800px; }
    .keys { display: none; }
    .touch { display: inline; }
    .stage {
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "screen screen" "duck jump";
      gap: 22px 16px;
    }
    .screen { grid-area: screen; }
    #duck-pad { grid-area: duck; }
    #jump-pad { grid-area: jump; }
    .pad { display: flex; height: 88px; }
  }
  /* held sideways the buttons sit left and right of the game, under the thumbs */
  @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
    :root { --side: 188px; }
    .stage {
      grid-template-columns: 78px 1fr 78px;
      grid-template-areas: "duck screen jump";
      gap: 16px;
    }
    .pad { height: auto; }
  }
  @media (orientation: portrait) and (pointer: coarse) {
    .rotate { display: inline; }
  }

  /* narrow phones and the Galaxy Fold cover screen */
  @media (max-width: 480px) {
    :root { --pad: 10px; }
    button { font-size: 16px; padding: 8px 10px; }
    .hint { font-size: 16px; line-height: 1.7; }
  }

  /* phones held sideways: the game takes almost the whole screen */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --pad: 8px; --chrome: 84px; }
    header { margin-bottom: 10px; }
    h1 { font-size: 14px; text-shadow: 2px 2px 0 #000; }
    button { font-size: 16px; padding: 6px 10px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>NAPI <small>VS</small> <span>BATATRANS</span></h1>
    <div class="controls">
      <button id="fullscreen" type="button" hidden>Teljes képernyő</button>
      <button id="mute" type="button" aria-pressed="false">Hang be</button>
    </div>
  </header>
  <div class="stage">
    <button class="pad" id="duck-pad" type="button">
      <svg viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true"><path d="M5 1h4v6h4l-6 6-6-6h4z" fill="currentColor"/></svg>
      Guggolás
    </button>
    <div class="screen">
      <canvas id="game" width="400" height="130" aria-label="Napi vs Batatrans játék"></canvas>
      <canvas id="hud" width="800" height="260" aria-hidden="true"></canvas>
    </div>
    <button class="pad" id="jump-pad" type="button">
      <svg viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true"><path d="M7 1l6 6H9v6H5V7H1z" fill="currentColor"/></svg>
      Ugrás
    </button>
  </div>
  <p class="hint">
    <span class="keys"><kbd>Szóköz</kbd> <kbd>↑</kbd> ugrás &nbsp; <kbd>↓</kbd> guggolás<br></span>
    <span class="touch">Tartsd nyomva a bal gombot a guggoláshoz, a jobbal (vagy bárhova koppintva) ugrasz.<br></span>
    <span class="rotate">Fordítsd el a telefont a nagyobb képért!<br></span>
    Kerüld ki a gépeket és a Batatrans csapatot. Néhányan repülnek is!
  </p>
</main>

<script>
(() => {
  const W = 800, H = 260, GROUND = 222;
  // the game is drawn at half size and the browser scales it up with hard pixel edges
  const RES = 0.5;
  const snap = v => Math.round(v * RES) / RES;
  // Tiny5 has proper Hungarian accents (ő, ű) and clear capitals; Press Start 2P is kept for logo-style text
  const FONT = '{size}px "Tiny5", ui-monospace, Consolas, monospace';
  const LOGO_FONT = '{size}px "Press Start 2P", ui-monospace, Consolas, monospace';

  // Napi's frames in napi-sprites.png as [x, y, w, h, head centre x] in atlas pixels, plus a size fix:
  // the sheet draws some poses smaller, so each frame is scaled until its head matches the run frames
  const NAPI_FRAMES = [
    [0, 0, 203, 280, 143.4, 1.02], [268, 0, 204, 279, 138.3, 1.01], [536, 0, 204, 278, 138.6, 0.99], [804, 0, 201, 282, 138.3, 0.98],
    [0, 284, 156, 214, 117.8, 1.12], [268, 284, 157, 265, 90.0, 1.17], [536, 284, 150, 250, 93.1, 1.17], [804, 284, 168, 214, 130.5, 1.12],
    [0, 551, 176, 159, 138.4, 1.11], [268, 551, 234, 154, 196.3, 1.11], [536, 551, 266, 145, 228.4, 1.11], [804, 551, 171, 152, 132.9, 1.11],
  ];
  const frameSize = f => {
    const [, , w, h, headX, fix] = NAPI_FRAMES[f], k = SPRITE_SCALE * fix;
    return { w: w * k, h: h * k, headX: headX * k };
  };
  // the sheet's run frames all have the same leg in front, so stride and knee-up poses alternate to read as steps
  const RUN = [0, 5, 0, 5], READY = 4, JUMP_UP = 5, JUMP_DOWN = 6, LAND = 7, CROUCH = [8, 9, 10, 11];
  const NAPI_H = 92, SPRITE_SCALE = NAPI_H / 280;   // game px per atlas px
  const HEAD_X = 46;                                 // Napi's head is drawn this far right of napi.x
  const GRAVITY = 2500, JUMP_V = 830, SHORT_HOP_V = 400;
  const START_SPEED = 400, MAX_SPEED = 1000, ACCEL = 9;
  const INK = '#2b2430', ORANGE = '#f26b1d', ORANGE_DARK = '#b8430a';

  const canvas = document.getElementById('game');
  const gameCtx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const hudCtx = hud.getContext('2d');
  let ctx = gameCtx;   // the drawing helpers draw on whichever layer is current
  const muteBtn = document.getElementById('mute');
  canvas.width = W * RES;
  canvas.height = H * RES;
  gameCtx.setTransform(RES, 0, 0, RES, 0, 0);
  gameCtx.imageSmoothingQuality = 'high';

  function sizeHud() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    hud.width = W * dpr;
    hud.height = H * dpr;
    hudCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeHud();
  window.addEventListener('resize', sizeHud);

  const napiSprites = new Image();
  napiSprites.src = 'napi-sprites.png';
  const loaded = img => img.complete && img.naturalWidth > 0;

  // ---------- storage (best effort) ----------
  function loadHi() {
    try { return parseInt(localStorage.getItem('napisaurus-hi') || '0', 10) || 0; } catch { return 0; }
  }
  function saveHi(v) {
    try { localStorage.setItem('napisaurus-hi', String(v)); } catch {}
  }

  // ---------- sound ----------
  let actx = null;
  let muted = false;
  try { muted = localStorage.getItem('napisaurus-muted') === '1'; } catch {}
  function syncMute() {
    muteBtn.textContent = muted ? 'Hang ki' : 'Hang be';
    muteBtn.setAttribute('aria-pressed', String(muted));
  }
  syncMute();
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('napisaurus-muted', muted ? '1' : '0'); } catch {}
    syncMute();
    muteBtn.blur();
  });

  // ---------- fullscreen (phones: hides the browser bar and turns the game sideways) ----------
  const fsBtn = document.getElementById('fullscreen');
  const root = document.documentElement;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  if ((document.fullscreenEnabled || document.webkitFullscreenEnabled) && matchMedia('(pointer: coarse)').matches) {
    fsBtn.hidden = false;
  }
  const syncFs = () => { fsBtn.textContent = fsElement() ? 'Kilépés' : 'Teljes képernyő'; };
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);
  fsBtn.addEventListener('click', async () => {
    fsBtn.blur();
    try {
      if (fsElement()) {
        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        await (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
      }
    } catch {}
  });

  function beep(freq, dur, { type = 'square', vol = 0.04, slideTo = null, delay = 0 } = {}) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();   // mobile browsers start audio paused
      const t0 = actx.currentTime + delay;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(actx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch {}
  }
  const sfx = {
    jump: () => beep(480, 0.11, { slideTo: 760 }),
    point: () => { beep(880, 0.08); beep(1320, 0.12, { delay: 0.09 }); },
    hit: () => beep(220, 0.35, { type: 'sawtooth', vol: 0.06, slideTo: 60 }),
  };

  // ---------- helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const setFont = (size, font = FONT) => { ctx.font = font.replace('{size}', size); };

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${[n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * f))})`;
  }

  function rr(x, y, w, h, r, fill, stroke = INK, lw = 2) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }

  function circle(x, y, r, fill, stroke = INK, lw = 2) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }

  // a thick outlined stroke through the given points (arms, legs)
  function limb(pts, width, color) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const [lw, c] of [[width + 3, INK], [width, color]]) {
      ctx.strokeStyle = c;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    }
  }

  function codeLines(x, y, w, h, seed, color = '#4ade80') {
    ctx.fillStyle = color;
    const rows = Math.floor((h - 4) / 4);
    for (let i = 0; i < rows; i++) {
      const s = Math.sin(seed * 13.7 + i * 7.3) * 0.5 + 0.5;
      const indent = (i % 3) * 4;
      ctx.fillRect(x + 4 + indent, y + 4 + i * 4, snap(Math.max(4, (w - 8 - indent) * s)), 2);
    }
  }

  // ---------- computers ----------
  function drawLaptop(o, b) {
    const x = o.x;
    rr(x + 5, b - 31, 34, 25, 2, '#5b616b');
    rr(x + 8, b - 28, 28, 19, 0, '#14231b', null);
    codeLines(x + 8, b - 28, 28, 19, o.seed);
    rr(x, b - 7, 44, 7, 2, '#4a4f57');
  }

  function drawMonitor(x, b, seed, bsod, t) {
    // stand
    ctx.beginPath();
    ctx.moveTo(x + 16, b - 12); ctx.lineTo(x + 28, b - 12);
    ctx.lineTo(x + 34, b); ctx.lineTo(x + 10, b); ctx.closePath();
    ctx.fillStyle = '#c9c0aa'; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    // body
    rr(x, b - 50, 44, 39, 3, '#ddd5c2');
    if (bsod) {
      rr(x + 5, b - 45, 34, 25, 0, '#1f4fbf', null);
      ctx.fillStyle = '#fff';
      setFont(16, LOGO_FONT);
      ctx.fillText(':(', x + 6, b - 27);
      ctx.fillRect(x + 8, b - 25, 24, 2);
    } else {
      rr(x + 5, b - 45, 34, 25, 0, '#14231b', null);
      codeLines(x + 5, b - 45, 34, 25, seed);
      if (Math.floor(t * 3) % 2) { ctx.fillStyle = '#4ade80'; ctx.fillRect(x + 30, b - 26, 4, 4); }
    }
    ctx.fillStyle = '#7bd389';
    ctx.fillRect(x + 36, b - 18, 4, 4);
  }

  function drawTower(o, b, t) {
    const x = o.x;
    rr(x, b - 58, 28, 58, 2, '#ddd5c2');
    rr(x + 4, b - 52, 20, 8, 0, '#c9c0aa', INK, 2);
    rr(x + 4, b - 40, 20, 8, 0, '#c9c0aa', INK, 2);
    ctx.fillStyle = INK;
    for (let i = 0; i < 3; i++) ctx.fillRect(x + 6, b - 26 + i * 4, 16, 2);
    ctx.fillStyle = Math.floor(t * 4 + o.seed) % 2 ? '#22c55e' : '#14532d';
    ctx.fillRect(x + 12, b - 10, 4, 4);
  }

  function drawServer(o, b, t) {
    const x = o.x;
    rr(x, b - 80, 40, 80, 2, '#2f3540');
    for (let i = 0; i < 7; i++) {
      const y = b - 76 + i * 10;
      rr(x + 4, y, 32, 8, 0, '#3f4754', '#1d2129', 2);
      ctx.fillStyle = Math.sin(t * 9 + i * 2.1 + o.seed) > 0 ? '#22c55e' : '#14532d';
      ctx.fillRect(x + 28, y + 2, 4, 4);
      ctx.fillStyle = (i + Math.floor(t * 2)) % 3 ? '#f59e0b' : '#78350f';
      ctx.fillRect(x + 22, y + 2, 4, 4);
    }
  }

  // ---------- Batatrans crew ----------
  const HAIR = ['#3b2a1f', '#6b4423', '#1f1f1f', '#c58b3c', '#8a8a8a', '#a33b20'];
  const SKIN = ['#f1c7a3', '#e0ac85', '#c68a5f', '#f5d3b8', '#8d5a3b'];
  const PANTS = ['#2b3a55', '#2b3a55', '#3f3f46', '#5b4a36'];
  const STYLES = ['short', 'short', 'long', 'bun', 'cap', 'bald'];
  const ITEMS = [null, null, 'mug', 'clipboard', 'phone', 'papers'];
  const LINES = [
    'Van 1 perced?', 'Gyors hívás?', 'Megjavult?', 'A nyomtató!', 'Nincs Wi-Fi!',
    'Hibajegy #42', 'Megbeszélés!', 'Segítség!', 'Excel lehalt', 'Új jelszó?',
  ];

  const randomLook = (styles = STYLES) => ({
    hair: pick(HAIR), skin: pick(SKIN), pants: pick(PANTS), style: pick(styles), item: pick(ITEMS),
    glasses: Math.random() < 0.3, beard: Math.random() < 0.2,
  });

  // head centred on (x, y), facing left towards Napi
  function drawHead(x, y, look) {
    if (look.style === 'long') rr(x + 1, y - 7, 11, 24, 4, look.hair);   // hair falling down the back
    circle(x, y, 10, look.skin);
    // nose and ear
    ctx.beginPath(); ctx.arc(x - 10, y + 1, 2.5, Math.PI * 0.5, Math.PI * 1.5);
    ctx.fillStyle = look.skin; ctx.fill(); ctx.stroke();
    circle(x + 4, y + 1, 3, look.skin, INK, 1.5);
    ctx.fillStyle = 'rgba(43,36,48,0.3)';
    ctx.fillRect(x + 3, y, 2, 2);

    if (look.style === 'cap') {
      ctx.beginPath(); ctx.arc(x + 1, y - 2, 10.5, Math.PI, Math.PI * 2); ctx.closePath();
      ctx.fillStyle = ORANGE; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      rr(x - 17, y - 4, 12, 4, 1, ORANGE_DARK);
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y - 10, 4, 4);
    } else if (look.style === 'bald') {
      ctx.fillStyle = look.hair; ctx.fillRect(x + 5, y - 5, 5, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x - 4, y - 8, 4, 2);
    } else {
      ctx.beginPath();
      ctx.moveTo(x - 10, y - 2);
      ctx.arc(x + 0.5, y - 1, 10.5, Math.PI * 1.02, Math.PI * 2.15);
      ctx.lineTo(x + 6, y - 3);
      ctx.lineTo(x - 4, y - 6);
      ctx.closePath();
      ctx.fillStyle = look.hair; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      if (look.style === 'bun') circle(x + 9, y - 10, 5, look.hair);
    }
    if (look.beard) {
      ctx.beginPath();
      ctx.arc(x - 1, y + 1, 9.5, Math.PI * 0.1, Math.PI * 0.95);
      ctx.arc(x - 3, y + 2, 5, Math.PI * 0.9, Math.PI * 0.15, true);
      ctx.closePath();
      ctx.fillStyle = look.hair; ctx.fill();
    }
    // face
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 8, y - 2, 4, 4);
    ctx.fillStyle = INK;
    ctx.fillRect(x - 8, y - 1, 2, 3);
    ctx.fillRect(x - 9, y - 5, 5, 2);
    if (!look.beard) ctx.fillRect(x - 8, y + 5, 4, 2);
    ctx.fillStyle = 'rgba(240,120,120,0.45)'; ctx.fillRect(x - 5, y + 2, 4, 2);
    if (look.glasses) {
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      ctx.strokeRect(x - 10, y - 3, 7, 6);
      ctx.beginPath(); ctx.moveTo(x - 3, y - 1); ctx.lineTo(x + 3, y - 1); ctx.stroke();
    }
  }

  // swing > 0 moves the knee forward (left), bend folds the shin back
  function legJoints(hx, hy, swing, bend) {
    const kx = hx - Math.sin(swing) * 15, ky = hy + Math.cos(swing) * 15;
    const a = swing - bend;
    return [[hx, hy], [kx, ky], [kx - Math.sin(a) * 15, ky + Math.cos(a) * 15]];
  }

  function armJoints(sx, sy, swing, bend) {
    const ex = sx - Math.sin(swing) * 10, ey = sy + Math.cos(swing) * 10;
    const a = swing + bend;
    return [[sx, sy], [ex, ey], [ex - Math.sin(a) * 9, ey + Math.cos(a) * 9]];
  }

  function drawArm(j, look) {
    limb(j, 4, look.skin);
    limb([j[0], [(j[0][0] + j[1][0]) / 2, (j[0][1] + j[1][1]) / 2]], 6, ORANGE);   // short sleeve
    circle(j[2][0], j[2][1], 2.8, look.skin, INK, 1.5);
  }

  function drawShoe(fx, fy) {
    rr(fx - 8, fy - 4, 11, 6, 2, '#26222b');
    ctx.fillStyle = '#8b8496';
    ctx.fillRect(fx - 7, fy, 8, 2);
  }

  function drawTorso(cx, hipY) {
    const top = hipY - 28;
    rr(cx - 11, top, 22, 30, 6, ORANGE);
    ctx.fillStyle = ORANGE_DARK;
    ctx.fillRect(cx + 5, top + 5, 4, 20);
    // polo collar
    ctx.fillStyle = '#fff3e6';
    ctx.beginPath(); ctx.moveTo(cx - 8, top + 1); ctx.lineTo(cx, top + 1); ctx.lineTo(cx - 5, top + 7); ctx.closePath(); ctx.fill();
    // belt
    ctx.fillStyle = '#2a2230'; ctx.fillRect(cx - 10, hipY - 4, 20, 4);
    ctx.fillStyle = '#e0b341'; ctx.fillRect(cx - 8, hipY - 4, 4, 4);
    // lanyard and Batatrans ID badge
    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 8, top + 2); ctx.lineTo(cx - 5, top + 12); ctx.lineTo(cx - 1, top + 2); ctx.stroke();
    rr(cx - 9, top + 11, 8, 10, 1, '#ffffff', INK, 1.5);
    ctx.fillStyle = ORANGE; ctx.fillRect(cx - 8, top + 12, 6, 3);
    ctx.fillStyle = '#9ca3af'; ctx.fillRect(cx - 8, top + 17, 4, 2);
  }

  function drawItem(item, hx, hy, t) {
    if (item === 'mug') {
      rr(hx - 10, hy - 7, 8, 9, 1, '#ffffff');
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(hx - 1, hy - 3, 2.5, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      ctx.fillStyle = ORANGE; ctx.fillRect(hx - 9, hy - 3, 6, 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const rise = (t * 10) % 6;
      ctx.fillRect(snap(hx - 8 + Math.sin(t * 8) * 1.5), snap(hy - 12 - rise), 2, 4);
    } else if (item === 'clipboard') {
      rr(hx - 13, hy - 15, 12, 16, 1, '#a0743f');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(hx - 11, hy - 12, 8, 11);
      ctx.fillStyle = '#9ca3af';
      for (let i = 0; i < 3; i++) ctx.fillRect(hx - 10, hy - 10 + i * 3, 6, 1.5);
      ctx.fillStyle = '#6b7280'; ctx.fillRect(hx - 9, hy - 17, 4, 3);
    } else if (item === 'papers') {
      rr(hx - 14, hy - 4, 13, 5, 0, '#ffffff', INK, 1.5);
      rr(hx - 12, hy - 8, 13, 5, 0, '#f3f4f6', INK, 1.5);
    }
  }

  function drawWalker(cx, b, p, look, t) {
    const legs = [0, Math.PI].map(off => legJoints(cx, 0, Math.sin(p + off) * 0.45, Math.max(0, Math.cos(p + off)) * 0.8));
    const lowest = Math.max(legs[0][2][1], legs[1][2][1]);
    const hipY = b - 2 - lowest;                  // keeps the planted foot on the ground
    for (const leg of legs) for (const pt of leg) pt[1] += hipY;
    const sx = cx + 1, sy = hipY - 23;
    const headX = cx - 1, headY = hipY - 39;

    drawArm(armJoints(sx, sy, Math.sin(p) * 0.5, 0.35), { ...look, skin: shade(look.skin, 0.85) });
    limb(legs[1], 6, shade(look.pants, 0.75));
    drawShoe(legs[1][2][0], legs[1][2][1]);
    limb(legs[0], 6, look.pants);
    drawShoe(legs[0][2][0], legs[0][2][1]);
    ctx.fillStyle = look.skin; ctx.fillRect(headX - 3, headY + 6, 6, 8);   // neck
    drawTorso(cx, hipY);
    drawHead(headX, headY, look);

    if (look.item === 'phone') {
      const hand = [headX + 3, headY + 5];
      limb([[sx, sy], [sx - 7, sy + 8], hand], 4, look.skin);
      limb([[sx, sy], [sx - 3, sy + 4]], 6, ORANGE);
      rr(headX + 1, headY - 5, 5, 11, 1, '#1f2937');
      ctx.fillStyle = '#7dd3fc'; ctx.fillRect(headX + 2, headY - 3, 2, 6);
      circle(hand[0], hand[1], 2.8, look.skin, INK, 1.5);
    } else if (look.item) {
      const j = armJoints(sx, sy, 0.2, 1.6);
      drawItem(look.item, j[2][0], j[2][1], t);
      drawArm(j, look);
    } else {
      drawArm(armJoints(sx, sy, -Math.sin(p) * 0.5, 0.35), look);
    }
  }

  function drawFlyer(o, b, t) {
    const x = o.x, cy = b - 13, look = o.look;
    const flap = Math.sin(t * 14 + o.seed) * 4;
    // speed lines
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 3; i++) ctx.fillRect(snap(x + 72 + ((t * 140 + i * 13) % 14)), cy - 10 + i * 8, 14, 2);
    // cape
    ctx.beginPath();
    ctx.moveTo(x + 18, cy - 7);
    ctx.quadraticCurveTo(x + 44, cy - 18 + flap, x + 68, cy - 12 - flap);
    ctx.lineTo(x + 63, cy - 5 + flap * 0.5);
    ctx.lineTo(x + 68, cy + 1 - flap * 0.3);
    ctx.quadraticCurveTo(x + 44, cy - 1, x + 22, cy + 1);
    ctx.closePath();
    ctx.fillStyle = ORANGE_DARK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    // legs and boots
    limb([[x + 38, cy + 2], [x + 49, cy + 6], [x + 58, cy + 5 + flap * 0.5]], 6, shade(look.pants, 0.75));
    rr(x + 57, cy + 1 + flap * 0.5, 7, 8, 2, '#26222b');
    limb([[x + 38, cy], [x + 50, cy + 1], [x + 59, cy - 1 - flap * 0.4]], 6, look.pants);
    rr(x + 58, cy - 6 - flap * 0.4, 7, 8, 2, '#26222b');
    // body with belt and emblem
    rr(x + 15, cy - 8, 27, 15, 6, ORANGE);
    ctx.fillStyle = ORANGE_DARK; ctx.fillRect(x + 19, cy + 2, 18, 3);
    ctx.fillStyle = '#2a2230'; ctx.fillRect(x + 36, cy - 7, 4, 13);
    ctx.fillStyle = '#e0b341'; ctx.fillRect(x + 36, cy - 2, 4, 4);
    circle(x + 26, cy - 1, 4.5, '#ffffff', INK, 1.5);
    ctx.fillStyle = ORANGE; ctx.fillRect(x + 24, cy - 3, 4, 4);
    // necktie flapping back over the shoulder
    ctx.beginPath();
    ctx.moveTo(x + 17, cy - 6); ctx.lineTo(x + 31, cy - 14 + flap);
    ctx.lineTo(x + 33, cy - 9 + flap); ctx.lineTo(x + 19, cy - 3); ctx.closePath();
    ctx.fillStyle = '#1d4ed8'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
    // arm punching forward
    const fist = [x - 5, cy - 8 - flap * 0.3];
    limb([[x + 18, cy - 3], [x + 6, cy - 7], fist], 4, look.skin);
    limb([[x + 18, cy - 3], [x + 11, cy - 5]], 6, ORANGE);
    circle(fist[0], fist[1], 3.5, look.skin);
    // head with flying goggles
    drawHead(x + 10, cy - 6, { ...look, glasses: false });
    ctx.fillStyle = '#2a2230'; ctx.fillRect(x + 2, cy - 10, 17, 3);
    rr(x - 1, cy - 11, 8, 6, 2, '#9be7ff', INK, 1.5);
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 1, cy - 10, 2, 2);
  }

  function drawBubble(text, cx, by) {
    setFont(22);
    const w = ctx.measureText(text).width + 16, h = 30;
    const x = snap(Math.min(Math.max(cx - w / 2, 4), W - w - 4)), y = by - h;
    rr(x, y, w, h, 4, '#fff', INK, 2);
    ctx.beginPath();
    ctx.moveTo(cx - 5, y + h - 1); ctx.lineTo(cx, y + h + 7); ctx.lineTo(cx + 5, y + h - 1);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 5, y + h); ctx.lineTo(cx, y + h + 7); ctx.lineTo(cx + 5, y + h); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.fillText(text, x + 8, y + 22);
  }

  // ---------- obstacle factory ----------
  function makeObstacle() {
    const r = Math.random();
    const seed = Math.random() * 100;
    if (score > 150 && r < 0.22) {
      const elev = pick([14, 74, 74, 104]);
      return { kind: 'flyer', w: 64, h: 26, elev, vx: 70, seed, look: randomLook(['short', 'cap', 'bald', 'bun']), inset: 5 };
    }
    if (r < 0.47) {
      const count = score > 350 && Math.random() < 0.35 ? 2 : 1;
      const looks = Array.from({ length: count }, () => randomLook());
      return {
        kind: 'walker', w: count === 2 ? 52 : 26, h: 76, elev: 0, vx: 45, seed, looks, count,
        say: Math.random() < 0.7 ? pick(LINES) : null, inset: 5,
      };
    }
    const big = score > 250;
    const opts = ['laptop', 'monitor', 'tower', 'bsod'];
    if (big) opts.push('pair', 'server', 'pair');
    const type = pick(opts);
    const dims = {
      laptop: [44, 31], monitor: [44, 50], bsod: [44, 50], tower: [28, 58], pair: [90, 50], server: [40, 80],
    }[type];
    return { kind: 'computer', type, w: dims[0], h: dims[1], elev: 0, vx: 0, seed, inset: 4 };
  }

  function drawObstacle(o, t) {
    const b = GROUND - o.elev;
    ctx.save();
    ctx.translate(snap(o.x) - o.x, 0);   // whole-pixel steps keep edges crisp while scrolling
    if (o.kind === 'computer') {
      if (o.type === 'laptop') drawLaptop(o, b);
      else if (o.type === 'monitor') drawMonitor(o.x, b, o.seed, false, t);
      else if (o.type === 'bsod') drawMonitor(o.x, b, o.seed, true, t);
      else if (o.type === 'tower') drawTower(o, b, t);
      else if (o.type === 'server') drawServer(o, b, t);
      else if (o.type === 'pair') {
        drawMonitor(o.x, b, o.seed, false, t);
        drawMonitor(o.x + 46, b, o.seed + 3, Math.sin(o.seed) > 0.6, t);
      }
    } else if (o.kind === 'walker') {
      const phase = t * 10 + o.seed;
      if (o.count === 2) drawWalker(o.x + 39, b, phase + 1.7, o.looks[1], t);
      drawWalker(o.x + 13, b, phase, o.looks[0], t);
    } else {
      drawFlyer(o, b, t);
    }
    ctx.restore();
  }

  function obstacleBox(o) {
    const i = o.inset;
    return { x: o.x + i, y: GROUND - o.elev - o.h + i, w: o.w - i * 2, h: o.h - i * 2 };
  }

  // ---------- background ----------
  const SKY = [['#8fd0ef', 52], ['#a2d8f1', 44], ['#b5e0f3', 38], ['#c8e8f4', 34], ['#daf0f3', 30], ['#ebf6f1', 24]];
  const CLOUD = [
    '....XXXX.......',
    '..XXXXXXXX.XX..',
    '.XXXXXXXXXXXXX.',
    'XXXXXXXXXXXXXXX',
    '.SSSSSSSSSSSSS.',
  ];
  const clouds = Array.from({ length: 4 }, (_, i) => ({ x: i * 230 + rand(0, 120), y: rand(56, 96), s: pick([4, 6]) }));
  // the Batatrans campus: two big HQ buildings per loop, the rest are smaller company blocks
  const skyline = [];
  let skylineWidth = 0;
  for (let i = 0; i < 14; i++) {
    const hq = i % 7 === 2, sign = i % 7 === 5;
    const w = hq ? 300 : sign ? 160 : snap(rand(56, 96)), h = hq ? 112 : snap(rand(42, 86));
    skyline.push({ x: skylineWidth, w, h, hq, sign, seed: i * 7 });
    skylineWidth += w + 12;
  }

  function drawCloud(x, y, s) {
    x = snap(x);
    CLOUD.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) {
        if (row[c] === '.') continue;
        ctx.fillStyle = row[c] === 'X' ? '#ffffff' : '#cfe3ee';
        ctx.fillRect(x + c * s, y + r * s, s, s);
      }
    });
  }

  function drawWindows(x, y, w, gx, gy, x0, x1, y1, seed, dark, lit) {
    let i = 0;
    for (let wy = y; wy < y1; wy += gy) {
      for (let wx = x + x0; wx < x + w - x1; wx += gx) {
        ctx.fillStyle = Math.sin(seed + i++ * 12.9898) > 0.82 ? lit : dark;
        ctx.fillRect(wx, wy, 8, 8);
      }
    }
  }

  function drawBuilding(bld, x) {
    x = snap(x);
    const y = GROUND - bld.h;
    ctx.textAlign = 'center';
    if (bld.hq) {
      ctx.fillStyle = '#f4d9bd';
      ctx.fillRect(x, y, bld.w, bld.h);
      ctx.fillStyle = '#e8874a';
      ctx.fillRect(x, y, bld.w, 6);
      drawWindows(x, y + 16, bld.w, 14, 14, 48, 12, GROUND - 34, bld.seed, '#d4a983', '#fde68a');
      // logo on the facade
      ctx.fillStyle = '#e8874a';
      ctx.fillRect(x + 10, y + 16, 26, 26);
      ctx.fillStyle = '#fff';
      setFont(16, LOGO_FONT);
      ctx.fillText('B', x + 24, y + 37);
      // glass entrance
      const dx = x + bld.w / 2 - 24;
      ctx.fillStyle = '#bfe3f2';
      ctx.fillRect(dx, GROUND - 26, 48, 26);
      ctx.fillStyle = '#e8874a';
      ctx.fillRect(dx - 4, GROUND - 30, 56, 4);
      ctx.fillStyle = '#8fb8c9';
      ctx.fillRect(dx + 22, GROUND - 26, 4, 26);
      // big rooftop letters
      ctx.fillStyle = '#c9b7a3';
      for (const px of [x + 40, x + bld.w / 2, x + bld.w - 40]) ctx.fillRect(px - 2, y - 8, 4, 8);
      setFont(32, LOGO_FONT);
      ctx.fillStyle = '#9a3412';
      ctx.fillText('BATATRANS', x + bld.w / 2 + 4, y - 6);
      ctx.fillStyle = ORANGE;
      ctx.fillText('BATATRANS', x + bld.w / 2, y - 10);
    } else {
      ctx.fillStyle = '#e6dccd';
      ctx.fillRect(x, y, bld.w, bld.h);
      ctx.fillStyle = '#f0b48a';
      ctx.fillRect(x, y, bld.w, 4);
      drawWindows(x, y + 10, bld.w, 12, 12, 8, 8, GROUND - 10, bld.seed, '#cbbfad', '#fde68a');
      if (bld.sign) {
        rr(x + bld.w / 2 - 76, y - 30, 152, 26, 0, '#fff3e6', INK, 2);
        setFont(16, LOGO_FONT);
        ctx.fillStyle = ORANGE_DARK;
        ctx.fillText('BATATRANS', x + bld.w / 2, y - 9);
      }
    }
    ctx.textAlign = 'left';
  }

  function drawBackground() {
    let y = 0;
    for (const [color, h] of SKY) { ctx.fillStyle = color; ctx.fillRect(0, y, W, h); y += h; }
    for (const c of clouds) drawCloud(c.x, c.y, c.s);

    // skyline, two copies for seamless wrap
    for (let k = 0; k < 2; k++) {
      for (const bld of skyline) {
        const x = bld.x - skyOffset + k * skylineWidth;
        if (x > W || x + bld.w < 0) continue;
        drawBuilding(bld, x);
      }
    }

    // ground
    ctx.fillStyle = '#ead8ad';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = INK;
    ctx.fillRect(0, GROUND, W, 4);
    for (let i = 0; i < 40; i++) {
      const span = W + 60;
      const x = snap(((i * 97.3 - groundOffset) % span + span) % span - 30);
      const gy = GROUND + 10 + ((i * 53) % 26);
      ctx.fillStyle = i % 4 ? '#c9b079' : '#b39a64';
      ctx.fillRect(x, snap(gy), (i % 3) * 2 + 4, 2);
    }
  }

  // ---------- game state ----------
  const napi = { x: 50, elev: 0, vy: 0, onGround: true, ducking: false, landedAt: -1 };
  let state = 'ready';
  let speed, score, hi = loadHi(), obstacles, particles, gapLeft;
  let t = 0, animClock = 0, skyOffset = 0, groundOffset = 0, dustTimer = 0;
  let flashUntil = 0, overAt = 0, overReason = '', newHi = false;
  let jumpHeld = false, duckHeld = false;

  function reset() {
    speed = START_SPEED;
    score = 0;
    obstacles = [];
    particles = [];
    gapLeft = 500;
    napi.elev = 0; napi.vy = 0; napi.onGround = true; napi.ducking = false;
    newHi = false;
  }
  reset();

  function start() {
    reset();
    state = 'running';
  }

  function jump() {
    if (napi.onGround && !duckHeld) {
      napi.vy = JUMP_V;
      napi.onGround = false;
      sfx.jump();
    }
  }

  function press() {
    if (state === 'ready') { start(); jump(); return; }
    if (state === 'over') {
      if (t - overAt > 0.5) { start(); }
      return;
    }
    jump();
  }

  function releaseJump() {
    if (state === 'running' && !napi.onGround && napi.vy > SHORT_HOP_V) napi.vy = SHORT_HOP_V;
  }

  const isCrouching = () => state === 'running' && napi.ducking && napi.onGround;

  function napiFrame() {
    if (state === 'ready') return READY;
    if (state === 'over') return RUN[0];
    if (!napi.onGround) return napi.vy > 0 ? JUMP_UP : JUMP_DOWN;
    if (isCrouching()) return CROUCH[Math.floor(animClock * 0.8) % 4];
    if (t - napi.landedAt < 0.09) return LAND;
    return RUN[Math.floor(animClock) % 4];
  }

  // the straight-legged knee-up pose stands taller than the stride; sink it (the ground hides the toe) so the head stays steady
  function runSink(f) {
    if (state !== 'running' || !napi.onGround || isCrouching() || f !== RUN[1]) return 0;
    return frameSize(f).h - frameSize(RUN[0]).h - 3;
  }

  function napiBox() {
    const f = napiFrame(), h = frameSize(f).h - runSink(f);
    if (isCrouching()) return { x: napi.x + 8, y: GROUND - h + 8, w: 48, h: h - 8 };
    return { x: napi.x + 16, y: GROUND - napi.elev - h + 6, w: 38, h: h - 8 };
  }

  const hits = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function reasonFor(o) {
    if (o.kind === 'flyer') return 'Elkapott egy repülő kolléga!';
    if (o.kind === 'walker') return o.say ? `Batatrans: "${o.say}"` : 'Sarokba szorított a Batatrans!';
    return {
      laptop: 'Átestél egy laptopon!',
      monitor: 'Nekimentél egy monitornak!',
      bsod: 'Kék halál!',
      tower: 'Nekifutottál egy gépháznak!',
      pair: 'Elkapott a dupla monitor!',
      server: 'Nekimentél a szervernek!',
    }[o.type];
  }

  function gameOver(o) {
    state = 'over';
    overAt = t;
    overReason = reasonFor(o);
    const final = Math.floor(score);
    if (final > hi) { newHi = hi > 0; hi = final; saveHi(hi); }
    sfx.hit();
  }

  function update(dt) {
    t += dt;
    for (const c of clouds) {
      c.x -= (state === 'running' ? speed * 0.06 : 12) * dt;
      if (c.x < -100) { c.x = W + rand(20, 160); c.y = rand(56, 96); c.s = pick([4, 6]); }
    }
    if (state !== 'running') return;

    speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
    const prev = Math.floor(score / 100);
    score += speed * dt * 0.025;
    if (Math.floor(score / 100) > prev) { flashUntil = t + 0.9; sfx.point(); }

    skyOffset = (skyOffset + speed * 0.12 * dt) % skylineWidth;
    groundOffset += speed * dt;
    // animation runs at a calm, capped frame rate (about 9-12 poses per second)
    animClock += dt * Math.min(12, 6 + speed / 120);

    // Napi physics
    napi.ducking = duckHeld;
    if (!napi.onGround) {
      napi.vy -= GRAVITY * (duckHeld ? 3 : 1) * dt;
      napi.elev += napi.vy * dt;
      if (napi.elev <= 0) {
        napi.elev = 0; napi.vy = 0; napi.onGround = true;
        napi.landedAt = t;
        for (let i = 0; i < 6; i++) particles.push({ x: napi.x + HEAD_X - 12 + rand(-12, 12), y: GROUND - 2, vx: rand(-80, 40), vy: rand(-60, -20), life: 0.35, max: 0.35 });
        if (jumpHeld && !duckHeld) jump();
      }
    }

    // running dust
    if (napi.onGround) {
      dustTimer -= dt;
      if (dustTimer <= 0) {
        dustTimer = 0.08;
        particles.push({ x: napi.x + 14, y: GROUND - 4, vx: -speed * 0.25 - rand(0, 40), vy: rand(-30, -5), life: 0.4, max: 0.4 });
      }
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);

    // spawn
    gapLeft -= speed * dt;
    if (gapLeft <= 0) {
      const o = makeObstacle();
      o.x = W + 10;
      obstacles.push(o);
      gapLeft = o.w + speed * rand(0.95, 1.75) + o.vx * 2.5;
    }

    const box = napiBox();
    for (const o of obstacles) {
      o.x -= (speed + o.vx) * dt;
      if (hits(box, obstacleBox(o))) { gameOver(o); break; }
    }
    obstacles = obstacles.filter(o => o.x + o.w > -40);
  }

  // ---------- render ----------
  function drawNapi() {
    const f = napiFrame();
    const [fx, fy, fw, fh] = NAPI_FRAMES[f];
    const { w, h, headX } = frameSize(f);
    const left = napi.x + HEAD_X - headX;

    // shadow
    const shadowScale = Math.max(0.35, 1 - napi.elev / 180);
    ctx.fillStyle = 'rgba(43,36,48,0.22)';
    ctx.fillRect(snap(left + w / 2 - w * 0.4 * shadowScale), GROUND + 4, snap(w * 0.8 * shadowScale), 4);

    ctx.save();
    if (napi.onGround) { ctx.beginPath(); ctx.rect(0, 0, W, GROUND + 2); ctx.clip(); }
    ctx.translate(snap(left + w / 2), snap(GROUND + 2 - napi.elev + runSink(f)));
    if (state === 'over') ctx.rotate(-0.18);
    if (loaded(napiSprites)) ctx.drawImage(napiSprites, fx, fy, fw, fh, -w / 2, -h, w, h);
    ctx.restore();

    if (state === 'over') {
      // dizzy stars over Napi's head
      setFont(22);
      ctx.fillStyle = '#f59e0b';
      for (let i = 0; i < 3; i++) {
        const a = t * 5 + i * (Math.PI * 2 / 3);
        ctx.fillText('*', snap(napi.x + HEAD_X - 8 + Math.cos(a) * 18), snap(GROUND - napi.elev - h + 4 + Math.sin(a) * 5));
      }
    }
  }

  const pad = n => String(Math.floor(n)).padStart(5, '0');

  function drawHud() {
    setFont(24);
    ctx.textAlign = 'right';
    const blinking = t < flashUntil && Math.floor(t * 8) % 2 === 0;
    ctx.fillStyle = '#5a5168';
    ctx.fillText(`Csúcs ${pad(hi)}`, W - 90, 34);
    if (!blinking) {
      ctx.fillStyle = INK;
      ctx.fillText(pad(t < flashUntil ? Math.floor(score / 100) * 100 : score), W - 16, 34);
    }
    ctx.textAlign = 'left';
  }

  function centerText(text, y, size, color = INK, shadow = null, font = FONT) {
    setFont(size, font);
    ctx.textAlign = 'center';
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(text, W / 2 + size / 8, y + size / 8); }
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
    ctx.textAlign = 'left';
  }

  function drawRestartIcon(cx, cy) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, Math.PI * 0.3, Math.PI * 1.9);
    ctx.stroke();
    const ax = cx + Math.cos(Math.PI * 1.9) * 14, ay = cy + Math.sin(Math.PI * 1.9) * 14;
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(ax + 8, ay - 3); ctx.lineTo(ax - 5, ay - 9); ctx.lineTo(ax - 1, ay + 7);
    ctx.closePath(); ctx.fill();
  }

  function render() {
    // the pixel world
    ctx = gameCtx;
    drawBackground();
    for (const o of obstacles) drawObstacle(o, t);

    for (const p of particles) {
      ctx.fillStyle = `rgba(150,130,95,${(p.life / p.max) * 0.9})`;
      ctx.fillRect(snap(p.x), snap(p.y), 4, 4);
    }
    drawNapi();

    // sharp text layer on top
    ctx = hudCtx;
    ctx.clearRect(0, 0, W, H);
    for (const o of obstacles) {
      if (o.say && o.x < W - 60 && o.x > napi.x + 60) drawBubble(o.say, snap(o.x) + 12, GROUND - o.elev - 92);
    }
    drawHud();

    if (state === 'ready') {
      rr(W / 2 - 300, 50, 600, 96, 0, '#fff7e8', INK, 4);
      centerText('NAPI VS BATATRANS', 100, 32, ORANGE, '#9a3412', LOGO_FONT);
      centerText('Nyomd meg a szóközt, vagy koppints!', 132, 24, INK);
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(255,247,232,0.85)';
      ctx.fillRect(0, 0, W, H);
      centerText('Játék vége', 80, 48, INK);
      centerText(overReason, 114, 24, ORANGE_DARK);
      if (newHi) centerText('Új rekord!', 142, 24, '#15803d');
      drawRestartIcon(W / 2, 178);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    render();
    duckPad.classList.toggle('on', duckHeld);
    jumpPad.classList.toggle('on', jumpHeld);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- input ----------
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  const DUCK_KEYS = ['ArrowDown', 'KeyS'];

  window.addEventListener('keydown', e => {
    if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) { jumpHeld = true; press(); }
    } else if (DUCK_KEYS.includes(e.code)) {
      e.preventDefault();
      duckHeld = true;
    }
  });
  window.addEventListener('keyup', e => {
    if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') { jumpHeld = false; releaseJump(); }
    else if (DUCK_KEYS.includes(e.code)) duckHeld = false;
  });
  window.addEventListener('blur', () => { jumpHeld = false; duckHeld = false; });

  // touch: hold the left pad to duck; the right pad, or a tap anywhere else on the page, jumps.
  // Each finger is tracked on its own so both pads can be used at once; swiping down still ducks.
  const duckPad = document.getElementById('duck-pad');
  const jumpPad = document.getElementById('jump-pad');
  let duckTouch = null, jumpTouch = null, swipeDuck = false, touchStartY = 0, touchStartT = 0;
  const syncDuck = () => { duckHeld = duckTouch !== null || swipeDuck; };

  document.addEventListener('touchstart', e => {
    if (e.target.closest('button:not(.pad)')) return;
    e.preventDefault();
    for (const tch of e.changedTouches) {
      if (tch.target.closest('#duck-pad')) {
        if (duckTouch !== null) continue;
        duckTouch = tch.identifier;
        syncDuck();
        if (state !== 'running') press();   // duck is held, so this starts the run without a jump
      } else if (jumpTouch === null) {
        jumpTouch = tch.identifier;
        touchStartY = tch.clientY;
        touchStartT = t;
        jumpHeld = true;
        press();
      }
    }
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (duckTouch === null && jumpTouch === null) return;
    e.preventDefault();
    for (const tch of e.changedTouches) {
      if (tch.identifier !== jumpTouch || swipeDuck || tch.clientY - touchStartY <= 25) continue;
      swipeDuck = true;
      jumpHeld = false;
      syncDuck();
      // the tap already started a hop; a quick swipe turns it into an immediate drop
      if (t - touchStartT < 0.25) napi.vy = Math.min(napi.vy, 0);
    }
  }, { passive: false });
  const endTouch = e => {
    for (const tch of e.changedTouches) {
      if (tch.identifier === duckTouch) { duckTouch = null; syncDuck(); }
      if (tch.identifier === jumpTouch) {
        jumpTouch = null; swipeDuck = false; jumpHeld = false;
        syncDuck();
        releaseJump();
      }
    }
  };
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);
  document.addEventListener('contextmenu', e => e.preventDefault());   // long-press menu

  canvas.addEventListener('mousedown', () => { jumpHeld = true; press(); });
  window.addEventListener('mouseup', () => { if (jumpHeld) { jumpHeld = false; releaseJump(); } });
})();
</script>
</body>
</html>
