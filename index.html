<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Napisaurus Run</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #3b3b3b;
    --muted: #8a8478;
    --accent: #e8590c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    padding: 16px;
  }
  main { width: 100%; max-width: 900px; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  h1 { margin: 0; font-size: clamp(20px, 4vw, 30px); letter-spacing: 2px; }
  h1 span { color: var(--accent); }
  button {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { background: var(--ink); color: var(--bg); }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 800 / 260;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: #f7f4ec;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .hint { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.6; }
  kbd {
    font: inherit;
    border: 1px solid var(--muted);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 5px;
    color: var(--ink);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>NAPI<span>SAURUS</span></h1>
    <button id="mute" type="button" aria-pressed="false">Sound: on</button>
  </header>
  <canvas id="game" width="800" height="260" aria-label="Napisaurus runner game"></canvas>
  <p class="hint">
    <kbd>Space</kbd> / <kbd>↑</kbd> jump &nbsp;·&nbsp; <kbd>↓</kbd> duck &nbsp;·&nbsp;
    On a phone: tap to jump, swipe down to duck.<br>
    Jump over the computers, and watch out for the Batatrans crew, some of them can fly.
  </p>
</main>

<script>
(() => {
  const W = 800, H = 260, GROUND = 222;
  // Napi is drawn from three layers (body + two legs) so the legs can run; sprite sizes are in image pixels
  const SPRITE_W = 145, SPRITE_H = 288;
  const HIP_L = [56.5, 194.9], HIP_R = [98.4, 194.9];
  const NAPI_H = 92, NAPI_W = NAPI_H * SPRITE_W / SPRITE_H;
  // crouching pulls the legs up under the hoodie (sprite px) and drops the body by the same amount
  const CROUCH_LIFT = 58, CROUCH_DROP = CROUCH_LIFT * NAPI_H / SPRITE_H;
  const GRAVITY = 2500, JUMP_V = 830, SHORT_HOP_V = 400;
  const START_SPEED = 400, MAX_SPEED = 1000, ACCEL = 9;
  const INK = '#3b3b3b', ORANGE = '#e8590c', ORANGE_DARK = '#b8430a', NAVY = '#2b3a55';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const muteBtn = document.getElementById('mute');

  const loadImg = src => { const img = new Image(); img.src = src; return img; };
  const napiBody = loadImg('napi-body.png');
  const napiLegL = loadImg('napi-leg-l.png');
  const napiLegR = loadImg('napi-leg-r.png');
  const loaded = img => img.complete && img.naturalWidth > 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingQuality = 'high';
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- storage (best effort) ----------
  function loadHi() {
    try { return parseInt(localStorage.getItem('napisaurus-hi') || '0', 10) || 0; } catch { return 0; }
  }
  function saveHi(v) {
    try { localStorage.setItem('napisaurus-hi', String(v)); } catch {}
  }

  // ---------- sound ----------
  let actx = null;
  let muted = false;
  try { muted = localStorage.getItem('napisaurus-muted') === '1'; } catch {}
  function syncMute() {
    muteBtn.textContent = muted ? 'Sound: off' : 'Sound: on';
    muteBtn.setAttribute('aria-pressed', String(muted));
  }
  syncMute();
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('napisaurus-muted', muted ? '1' : '0'); } catch {}
    syncMute();
    muteBtn.blur();
  });

  function beep(freq, dur, { type = 'square', vol = 0.04, slideTo = null, delay = 0 } = {}) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime + delay;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(actx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch {}
  }
  const sfx = {
    jump: () => beep(480, 0.11, { slideTo: 760 }),
    point: () => { beep(880, 0.08); beep(1320, 0.12, { delay: 0.09 }); },
    hit: () => beep(220, 0.35, { type: 'sawtooth', vol: 0.06, slideTo: 60 }),
  };

  // ---------- helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function rr(x, y, w, h, r, fill, stroke = INK, lw = 2) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }

  function codeLines(x, y, w, h, seed, color = '#4ade80') {
    ctx.fillStyle = color;
    const rows = Math.floor((h - 4) / 4);
    for (let i = 0; i < rows; i++) {
      const s = Math.sin(seed * 13.7 + i * 7.3) * 0.5 + 0.5;
      const indent = (i % 3) * 3;
      ctx.fillRect(x + 3 + indent, y + 3 + i * 4, Math.max(4, (w - 8 - indent) * s), 2);
    }
  }

  // ---------- computers ----------
  function drawLaptop(o, b) {
    const x = o.x;
    rr(x + 5, b - 31, 34, 25, 3, '#5b616b');
    rr(x + 8, b - 28, 28, 19, 1, '#14231b', null);
    codeLines(x + 8, b - 28, 28, 19, o.seed);
    rr(x, b - 7, 44, 7, 2, '#4a4f57');
  }

  function drawMonitor(x, b, seed, bsod, t) {
    // stand
    ctx.beginPath();
    ctx.moveTo(x + 16, b - 12); ctx.lineTo(x + 28, b - 12);
    ctx.lineTo(x + 34, b); ctx.lineTo(x + 10, b); ctx.closePath();
    ctx.fillStyle = '#c9c0aa'; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    // body
    rr(x, b - 50, 44, 39, 5, '#ddd5c2');
    if (bsod) {
      rr(x + 5, b - 45, 34, 25, 2, '#1f4fbf', null);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px ui-monospace, Consolas, monospace';
      ctx.fillText(':(', x + 8, b - 31);
      ctx.fillRect(x + 9, b - 27, 24, 2);
      ctx.fillRect(x + 9, b - 24, 16, 2);
    } else {
      rr(x + 5, b - 45, 34, 25, 2, '#14231b', null);
      codeLines(x + 5, b - 45, 34, 25, seed);
      if (Math.floor(t * 3) % 2) { ctx.fillStyle = '#4ade80'; ctx.fillRect(x + 31, b - 26, 4, 3); }
    }
    ctx.fillStyle = '#7bd389';
    ctx.fillRect(x + 36, b - 17, 3, 3);
  }

  function drawTower(o, b, t) {
    const x = o.x;
    rr(x, b - 58, 28, 58, 3, '#ddd5c2');
    rr(x + 4, b - 52, 20, 7, 1, '#c9c0aa', INK, 1.5);
    rr(x + 4, b - 42, 20, 7, 1, '#c9c0aa', INK, 1.5);
    ctx.fillStyle = INK;
    for (let i = 0; i < 4; i++) ctx.fillRect(x + 6, b - 26 + i * 4, 16, 1.5);
    ctx.fillStyle = Math.floor(t * 4 + o.seed) % 2 ? '#22c55e' : '#14532d';
    ctx.beginPath(); ctx.arc(x + 14, b - 8, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawServer(o, b, t) {
    const x = o.x;
    rr(x, b - 80, 40, 80, 3, '#2f3540');
    for (let i = 0; i < 7; i++) {
      const y = b - 75 + i * 10.5;
      rr(x + 4, y, 32, 8, 1, '#3f4754', '#1d2129', 1);
      const on = Math.sin(t * 9 + i * 2.1 + o.seed) > 0;
      ctx.fillStyle = on ? '#22c55e' : '#14532d';
      ctx.fillRect(x + 28, y + 3, 3, 2);
      ctx.fillStyle = (i + Math.floor(t * 2)) % 3 ? '#f59e0b' : '#78350f';
      ctx.fillRect(x + 23, y + 3, 3, 2);
    }
  }

  // ---------- Batatrans crew ----------
  const HAIR = ['#3b2a1f', '#6b4423', '#1f1f1f', '#c58b3c', '#8a8a8a'];
  const SKIN = ['#f1c7a3', '#e0ac85', '#c68a5f', '#f5d3b8'];
  const LINES = [
    'Got a minute?', 'Quick call?', 'Is it fixed?', 'Printer broke!',
    'Wi-Fi is down!', 'Ticket #4521', 'Meeting now!', 'Can you help?',
    'Excel crashed!', 'Password reset?',
  ];

  function drawLogoB(cx, cy, size) {
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${size}px ui-monospace, Consolas, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('B', cx, cy + 0.5);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  function drawWalker(cx, b, phase, look) {
    const s = Math.sin(phase);
    ctx.lineCap = 'round';
    // back arm
    ctx.strokeStyle = look.skin; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx, b - 51); ctx.lineTo(cx + s * 9, b - 34); ctx.stroke();
    // legs
    ctx.strokeStyle = NAVY; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(cx, b - 30); ctx.lineTo(cx + s * 8, b - 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, b - 30); ctx.lineTo(cx - s * 8, b - 3); ctx.stroke();
    // shoes
    ctx.fillStyle = '#222';
    ctx.fillRect(cx + s * 8 - 6, b - 4, 8, 4);
    ctx.fillRect(cx - s * 8 - 6, b - 4, 8, 4);
    // shirt
    rr(cx - 11, b - 57, 22, 30, 7, ORANGE);
    // front arm
    ctx.strokeStyle = look.skin; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx, b - 51); ctx.lineTo(cx - s * 9, b - 34); ctx.stroke();
    drawLogoB(cx + 3, b - 40, 10);
    // head
    ctx.beginPath(); ctx.arc(cx, b - 66, 9.5, 0, Math.PI * 2);
    ctx.fillStyle = look.skin; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, b - 68, 9.5, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fillStyle = look.hair; ctx.fill();
    // face (looking left, towards Napi)
    ctx.fillStyle = INK;
    ctx.fillRect(cx - 6, b - 67, 2, 2.5);
    ctx.fillRect(cx - 7, b - 62, 4, 1.2);
  }

  function drawFlyer(o, b, t) {
    const x = o.x, cy = b - 13;
    const flap = Math.sin(t * 14 + o.seed) * 5;
    ctx.lineCap = 'round';
    // cape
    ctx.beginPath();
    ctx.moveTo(x + 18, cy - 7);
    ctx.quadraticCurveTo(x + 42, cy - 16 + flap, x + 64, cy - 10 - flap);
    ctx.lineTo(x + 60, cy - 2 + flap * 0.5);
    ctx.quadraticCurveTo(x + 40, cy - 2, x + 22, cy);
    ctx.closePath();
    ctx.fillStyle = ORANGE_DARK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
    // legs
    ctx.strokeStyle = NAVY; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(x + 36, cy + 2); ctx.lineTo(x + 56, cy + 4 + flap * 0.4); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.fillRect(x + 55, cy + 1 + flap * 0.4, 5, 7);
    // body
    rr(x + 14, cy - 8, 26, 16, 7, ORANGE);
    drawLogoB(x + 27, cy, 10);
    // arms reaching forward
    ctx.strokeStyle = o.look.skin; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x + 16, cy - 4); ctx.lineTo(x - 2, cy - 7 - flap * 0.6); ctx.stroke();
    // head
    ctx.beginPath(); ctx.arc(x + 9, cy - 3, 8.5, 0, Math.PI * 2);
    ctx.fillStyle = o.look.skin; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 10, cy - 5, 8.5, Math.PI * 1.1, Math.PI * 1.95);
    ctx.fillStyle = o.look.hair; ctx.fill();
    ctx.fillStyle = INK; ctx.fillRect(x + 4, cy - 4, 2, 2.5);
  }

  function drawBubble(text, cx, by) {
    ctx.font = 'bold 11px ui-monospace, Consolas, monospace';
    const w = ctx.measureText(text).width + 12, h = 18;
    const x = Math.min(Math.max(cx - w / 2, 4), W - w - 4), y = by - h;
    rr(x, y, w, h, 6, '#fff', INK, 1.5);
    ctx.beginPath();
    ctx.moveTo(cx - 4, y + h - 1); ctx.lineTo(cx, y + h + 6); ctx.lineTo(cx + 4, y + h - 1);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - 4, y + h); ctx.lineTo(cx, y + h + 6); ctx.lineTo(cx + 4, y + h); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.fillText(text, x + 6, y + 13);
  }

  const randomLook = () => ({ hair: pick(HAIR), skin: pick(SKIN) });

  // ---------- obstacle factory ----------
  function makeObstacle() {
    const r = Math.random();
    const seed = Math.random() * 100;
    if (score > 150 && r < 0.22) {
      const elev = pick([14, 74, 74, 104]);
      return { kind: 'flyer', w: 64, h: 26, elev, vx: 70, seed, look: randomLook(), inset: 5 };
    }
    if (r < 0.47) {
      const count = score > 350 && Math.random() < 0.35 ? 2 : 1;
      const looks = Array.from({ length: count }, randomLook);
      return {
        kind: 'walker', w: count === 2 ? 52 : 26, h: 70, elev: 0, vx: 45, seed, looks, count,
        say: Math.random() < 0.7 ? pick(LINES) : null, inset: 5,
      };
    }
    const big = score > 250;
    const opts = ['laptop', 'monitor', 'tower', 'bsod'];
    if (big) opts.push('pair', 'server', 'pair');
    const type = pick(opts);
    const dims = {
      laptop: [44, 31], monitor: [44, 50], bsod: [44, 50], tower: [28, 58], pair: [90, 50], server: [40, 80],
    }[type];
    return { kind: 'computer', type, w: dims[0], h: dims[1], elev: 0, vx: 0, seed, inset: 4 };
  }

  function drawObstacle(o, t) {
    const b = GROUND - o.elev;
    if (o.kind === 'computer') {
      if (o.type === 'laptop') drawLaptop(o, b);
      else if (o.type === 'monitor') drawMonitor(o.x, b, o.seed, false, t);
      else if (o.type === 'bsod') drawMonitor(o.x, b, o.seed, true, t);
      else if (o.type === 'tower') drawTower(o, b, t);
      else if (o.type === 'server') drawServer(o, b, t);
      else if (o.type === 'pair') {
        drawMonitor(o.x, b, o.seed, false, t);
        drawMonitor(o.x + 46, b, o.seed + 3, Math.sin(o.seed) > 0.6, t);
      }
    } else if (o.kind === 'walker') {
      const phase = t * 12 + o.seed;
      drawWalker(o.x + 13, b, phase, o.looks[0]);
      if (o.count === 2) drawWalker(o.x + 39, b, phase + 1.7, o.looks[1]);
      if (o.say && o.x < W - 60 && o.x > napi.x + 60) drawBubble(o.say, o.x + 13, b - 82);
    } else {
      drawFlyer(o, b, t);
    }
  }

  function obstacleBox(o) {
    const i = o.inset;
    return { x: o.x + i, y: GROUND - o.elev - o.h + i, w: o.w - i * 2, h: o.h - i * 2 };
  }

  // ---------- background ----------
  const clouds = Array.from({ length: 4 }, (_, i) => ({ x: i * 230 + rand(0, 120), y: rand(60, 100), s: rand(0.7, 1.2) }));
  // the Batatrans campus: two big HQ buildings per loop, the rest are smaller company blocks
  const skyline = [];
  let skylineWidth = 0;
  for (let i = 0; i < 14; i++) {
    const hq = i % 7 === 2;
    const w = hq ? 210 : rand(55, 95), h = hq ? 112 : rand(42, 86);
    skyline.push({ x: skylineWidth, w, h, hq, sign: i % 7 === 5 });
    skylineWidth += w + 12;
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#d6cfc0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, 10 * s, Math.PI * 0.5, Math.PI * 1.5);
    ctx.arc(x + 14 * s, y - 9 * s, 13 * s, Math.PI, Math.PI * 2);
    ctx.arc(x + 32 * s, y - 3 * s, 10 * s, Math.PI * 1.3, Math.PI * 0.5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawBuilding(bld, x) {
    const y = GROUND - bld.h;
    ctx.textAlign = 'center';
    if (bld.hq) {
      ctx.fillStyle = '#ecdccb';
      ctx.fillRect(x, y, bld.w, bld.h);
      ctx.fillStyle = '#f0b48a';
      ctx.fillRect(x, y, bld.w, 6);
      ctx.fillStyle = '#dcc6ae';
      for (let wy = y + 16; wy < GROUND - 32; wy += 13) {
        for (let wx = x + 40; wx < x + bld.w - 12; wx += 14) ctx.fillRect(wx, wy, 8, 8);
      }
      // logo on the facade
      ctx.beginPath(); ctx.arc(x + 20, y + 26, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#ec9a68'; ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px ui-monospace, Consolas, monospace';
      ctx.fillText('B', x + 20, y + 31);
      // glass entrance
      const dx = x + bld.w / 2 - 24;
      ctx.fillStyle = '#d3dde2';
      ctx.fillRect(dx, GROUND - 26, 48, 26);
      ctx.fillStyle = '#ec9a68';
      ctx.fillRect(dx - 4, GROUND - 30, 56, 4);
      ctx.fillStyle = '#bccad1';
      ctx.fillRect(dx + 23, GROUND - 26, 2, 26);
      // big rooftop letters
      ctx.fillStyle = '#c9b7a3';
      for (const px of [x + 30, x + bld.w / 2, x + bld.w - 30]) ctx.fillRect(px - 1, y - 8, 2, 8);
      ctx.fillStyle = '#e9874d';
      ctx.font = 'bold 27px ui-monospace, Consolas, monospace';
      ctx.fillText('BATATRANS', x + bld.w / 2, y - 9);
    } else {
      ctx.fillStyle = '#e6e0d5';
      ctx.fillRect(x, y, bld.w, bld.h);
      ctx.fillStyle = '#f0c6a7';
      ctx.fillRect(x, y, bld.w, 4);
      ctx.fillStyle = '#d9d1c4';
      for (let wy = y + 10; wy < GROUND - 10; wy += 12) {
        for (let wx = x + 7; wx < x + bld.w - 8; wx += 12) ctx.fillRect(wx, wy, 6, 6);
      }
      if (bld.sign) {
        rr(x + bld.w / 2 - 38, y - 19, 76, 15, 3, '#f6d2b8', '#e3a57c', 1.5);
        ctx.fillStyle = '#c4622a';
        ctx.font = 'bold 10px ui-monospace, Consolas, monospace';
        ctx.fillText('BATATRANS', x + bld.w / 2, y - 8);
      }
    }
    ctx.textAlign = 'left';
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#e7f0f7');
    g.addColorStop(1, '#f7f4ec');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const c of clouds) drawCloud(c.x, c.y, c.s);

    // skyline, two copies for seamless wrap
    for (let k = 0; k < 2; k++) {
      for (const bld of skyline) {
        const x = bld.x - skyOffset + k * skylineWidth;
        if (x > W || x + bld.w < 0) continue;
        drawBuilding(bld, x);
      }
    }

    // ground
    ctx.fillStyle = '#efe8da';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
    ctx.fillStyle = '#b9b09d';
    for (let i = 0; i < 40; i++) {
      const span = W + 60;
      const x = ((i * 97.3 - groundOffset) % span + span) % span - 30;
      const y = GROUND + 6 + ((i * 53) % 28);
      ctx.fillRect(x, y, (i % 3) + 2, 2);
    }
  }

  // ---------- game state ----------
  const napi = { x: 50, elev: 0, vy: 0, onGround: true, ducking: false };
  let state = 'ready';
  let speed, score, hi = loadHi(), obstacles, particles, gapLeft;
  let t = 0, runPhase = 0, skyOffset = 0, groundOffset = 0, dustTimer = 0;
  let flashUntil = 0, overAt = 0, overReason = '', newHi = false;
  let jumpHeld = false, duckHeld = false;

  function reset() {
    speed = START_SPEED;
    score = 0;
    obstacles = [];
    particles = [];
    gapLeft = 500;
    napi.elev = 0; napi.vy = 0; napi.onGround = true; napi.ducking = false;
    newHi = false;
  }
  reset();

  function start() {
    reset();
    state = 'running';
  }

  function jump() {
    if (napi.onGround && !duckHeld) {
      napi.vy = JUMP_V;
      napi.onGround = false;
      sfx.jump();
    }
  }

  function press() {
    if (state === 'ready') { start(); jump(); return; }
    if (state === 'over') {
      if (t - overAt > 0.5) { start(); }
      return;
    }
    jump();
  }

  function releaseJump() {
    if (state === 'running' && !napi.onGround && napi.vy > SHORT_HOP_V) napi.vy = SHORT_HOP_V;
  }

  const isCrouching = () => state === 'running' && napi.ducking && napi.onGround;

  function napiBox() {
    const h = isCrouching() ? NAPI_H - CROUCH_DROP : NAPI_H;
    return { x: napi.x + 9, y: GROUND - napi.elev - h + 6, w: NAPI_W - 18, h: h - 8 };
  }

  const hits = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function reasonFor(o) {
    if (o.kind === 'flyer') return 'A flying Batatrans colleague caught you!';
    if (o.kind === 'walker') return o.say ? `Batatrans got you: "${o.say}"` : 'Cornered by Batatrans!';
    return {
      laptop: 'Tripped over a laptop!',
      monitor: 'Crashed into a monitor!',
      bsod: 'Blue screen of death!',
      tower: 'Ran into a PC tower!',
      pair: 'Double monitor setup got you!',
      server: 'Hit the server rack!',
    }[o.type];
  }

  function gameOver(o) {
    state = 'over';
    overAt = t;
    overReason = reasonFor(o);
    const final = Math.floor(score);
    if (final > hi) { newHi = hi > 0; hi = final; saveHi(hi); }
    sfx.hit();
  }

  function update(dt) {
    t += dt;
    for (const c of clouds) {
      c.x -= (state === 'running' ? speed * 0.06 : 12) * dt;
      if (c.x < -60) { c.x = W + rand(20, 160); c.y = rand(60, 100); c.s = rand(0.7, 1.2); }
    }
    if (state !== 'running') return;

    speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
    const prev = Math.floor(score / 100);
    score += speed * dt * 0.025;
    if (Math.floor(score / 100) > prev) { flashUntil = t + 0.9; sfx.point(); }

    skyOffset = (skyOffset + speed * 0.12 * dt) % skylineWidth;
    groundOffset += speed * dt;
    runPhase += dt * speed / 26;

    // Napi physics
    napi.ducking = duckHeld;
    if (!napi.onGround) {
      napi.vy -= GRAVITY * (duckHeld ? 3 : 1) * dt;
      napi.elev += napi.vy * dt;
      if (napi.elev <= 0) {
        napi.elev = 0; napi.vy = 0; napi.onGround = true;
        for (let i = 0; i < 6; i++) particles.push({ x: napi.x + NAPI_W / 2 + rand(-12, 12), y: GROUND - 2, vx: rand(-80, 40), vy: rand(-60, -20), life: 0.35, max: 0.35 });
        if (jumpHeld && !duckHeld) jump();
      }
    }

    // running dust
    if (napi.onGround) {
      dustTimer -= dt;
      if (dustTimer <= 0) {
        dustTimer = 0.07;
        particles.push({ x: napi.x + 10, y: GROUND - 2, vx: -speed * 0.25 - rand(0, 40), vy: rand(-30, -5), life: 0.4, max: 0.4 });
      }
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);

    // spawn
    gapLeft -= speed * dt;
    if (gapLeft <= 0) {
      const o = makeObstacle();
      o.x = W + 10;
      obstacles.push(o);
      gapLeft = o.w + speed * rand(0.95, 1.75) + o.vx * 2.5;
    }

    const box = napiBox();
    for (const o of obstacles) {
      o.x -= (speed + o.vx) * dt;
      if (hits(box, obstacleBox(o))) { gameOver(o); break; }
    }
    obstacles = obstacles.filter(o => o.x + o.w > -20);
  }

  // ---------- render ----------
  function drawLeg(img, hip, { rot = 0, lift = 0 }) {
    if (!loaded(img)) return;
    ctx.save();
    ctx.translate(hip[0], hip[1] - lift);
    ctx.rotate(rot);
    ctx.drawImage(img, -hip[0], -hip[1]);
    ctx.restore();
  }

  // draws Napi with the feet centred on (0, 0); leg poses are in sprite pixels / radians
  function drawFigure(pose) {
    const k = NAPI_H / SPRITE_H;
    ctx.save();
    ctx.translate(-NAPI_W / 2, -NAPI_H);
    ctx.scale(k, k);
    drawLeg(napiLegL, HIP_L, pose.l);
    drawLeg(napiLegR, HIP_R, pose.r);
    if (loaded(napiBody)) ctx.drawImage(napiBody, 0, 0);
    ctx.restore();
  }

  function legPose() {
    if (state !== 'running') return { l: {}, r: {} };
    if (!napi.onGround) return { l: { rot: -0.4, lift: 26 }, r: { rot: 0.3 } };
    const s = Math.sin(runPhase);
    if (isCrouching()) {
      // squat with the knees apart, still taking small steps
      return {
        l: { rot: 0.28, lift: CROUCH_LIFT + Math.max(0, s) * 10 },
        r: { rot: -0.28, lift: CROUCH_LIFT + Math.max(0, -s) * 10 },
      };
    }
    // the leg swinging forward lifts its foot, the other one pushes back along the ground
    return {
      l: { rot: -0.32 * s, lift: Math.max(0, s) * 26 },
      r: { rot: 0.32 * s, lift: Math.max(0, -s) * 26 },
    };
  }

  function drawNapi() {
    const crouching = isCrouching();
    const running = state === 'running';

    // shadow
    const shadowScale = Math.max(0.35, 1 - napi.elev / 180);
    ctx.fillStyle = 'rgba(59,59,59,0.18)';
    ctx.beginPath();
    ctx.ellipse(napi.x + NAPI_W / 2, GROUND + 1, (NAPI_W / 2 + 4) * shadowScale, 4 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    const bob = running && napi.onGround ? Math.abs(Math.cos(runPhase)) * (crouching ? 1 : 2) : 0;
    let tilt = 0;
    if (running) tilt = crouching ? 0.12 : napi.onGround ? 0.05 : -0.04;
    if (state === 'over') tilt = -0.18;
    ctx.save();
    ctx.translate(napi.x + NAPI_W / 2, GROUND - napi.elev - bob);
    ctx.rotate(tilt);
    if (crouching) ctx.translate(0, CROUCH_DROP);
    drawFigure(legPose());
    ctx.restore();

    if (state === 'over') {
      // dizzy stars over Napi's head
      for (let i = 0; i < 3; i++) {
        const a = t * 5 + i * (Math.PI * 2 / 3);
        const sx = napi.x + NAPI_W / 2 + Math.cos(a) * 16;
        const sy = GROUND - napi.elev - NAPI_H - 6 + Math.sin(a) * 4;
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 12px ui-monospace, Consolas, monospace';
        ctx.fillText('*', sx - 3, sy + 4);
      }
    }
  }

  const pad = n => String(Math.floor(n)).padStart(5, '0');

  function drawHud() {
    ctx.font = 'bold 16px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'right';
    const blinking = t < flashUntil && Math.floor(t * 8) % 2 === 0;
    ctx.fillStyle = '#8a8478';
    ctx.fillText(`HI ${pad(hi)}`, W - 100, 28);
    if (!blinking) {
      ctx.fillStyle = INK;
      ctx.fillText(pad(t < flashUntil ? Math.floor(score / 100) * 100 : score), W - 16, 28);
    }
    ctx.textAlign = 'left';
  }

  function centerText(text, y, size, color = INK) {
    ctx.font = `bold ${size}px ui-monospace, Consolas, monospace`;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(text, W / 2, y);
    ctx.textAlign = 'left';
  }

  function drawRestartIcon(cx, cy) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, Math.PI * 0.3, Math.PI * 1.9);
    ctx.stroke();
    const ax = cx + Math.cos(Math.PI * 1.9) * 14, ay = cy + Math.sin(Math.PI * 1.9) * 14;
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(ax + 7, ay - 3); ctx.lineTo(ax - 4, ay - 8); ctx.lineTo(ax - 1, ay + 6);
    ctx.closePath(); ctx.fill();
  }

  function render() {
    drawBackground();
    for (const o of obstacles) drawObstacle(o, t);

    for (const p of particles) {
      ctx.fillStyle = `rgba(150,140,120,${(p.life / p.max) * 0.8})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    drawNapi();
    drawHud();

    if (state === 'ready') {
      rr(W / 2 - 170, 58, 340, 82, 10, 'rgba(255,255,255,0.92)', INK, 2);
      centerText('NAPISAURUS RUN', 92, 26);
      centerText('Press SPACE or tap to start', 124, 14, '#6b665c');
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(247,244,236,0.82)';
      ctx.fillRect(0, 0, W, H);
      centerText('G A M E   O V E R', 70, 24);
      centerText(overReason, 98, 14, ORANGE_DARK);
      if (newHi) centerText('NEW HIGH SCORE!', 122, 13, '#15803d');
      drawRestartIcon(W / 2, 156);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- input ----------
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  const DUCK_KEYS = ['ArrowDown', 'KeyS'];

  window.addEventListener('keydown', e => {
    if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) { jumpHeld = true; press(); }
    } else if (DUCK_KEYS.includes(e.code)) {
      e.preventDefault();
      duckHeld = true;
    }
  });
  window.addEventListener('keyup', e => {
    if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') { jumpHeld = false; releaseJump(); }
    else if (DUCK_KEYS.includes(e.code)) duckHeld = false;
  });
  window.addEventListener('blur', () => { jumpHeld = false; duckHeld = false; });

  let touchStartY = null, touchStartT = 0;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchStartY = e.touches[0].clientY;
    touchStartT = t;
    jumpHeld = true;
    press();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (touchStartY !== null && !duckHeld && e.touches[0].clientY - touchStartY > 25) {
      duckHeld = true;
      jumpHeld = false;
      // the tap already started a hop; a quick swipe turns it into an immediate drop
      if (t - touchStartT < 0.25) napi.vy = Math.min(napi.vy, 0);
    }
  }, { passive: false });
  const endTouch = () => { touchStartY = null; jumpHeld = false; duckHeld = false; releaseJump(); };
  canvas.addEventListener('touchend', endTouch);
  canvas.addEventListener('touchcancel', endTouch);

  canvas.addEventListener('mousedown', () => { jumpHeld = true; press(); });
  window.addEventListener('mouseup', () => { if (jumpHeld) { jumpHeld = false; releaseJump(); } });
})();
</script>
</body>
</html>
